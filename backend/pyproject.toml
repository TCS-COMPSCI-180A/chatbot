[project]
name = "chatbot-backend"
version = "0.1.0"
description = "FastAPI backend for chatbot application"
requires-python = ">=3.10"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
